name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'yuriidrapak/playwright-mixtape-reporter' && !github.event.release.prerelease
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: validate
    if: github.repository == 'yuriidrapak/playwright-mixtape-reporter' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No environment, npm credentials, or id-token permission in this job.
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      filename: ${{ steps.pack.outputs.filename }}
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Use the reviewed npm version
        run: npm install --global npm@11.19.1 --ignore-scripts
        working-directory: ${{ runner.temp }}
      - name: Verify public source, release version, policy and main ancestry
        run: |
          node scripts/check-release.mjs
          npm run security
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci --ignore-scripts
      - name: Pack and inspect the release artifact
        id: pack
        run: npm run pack
      - name: Test the exact release tarball
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.filename }}
        run: npm run test:package -- "$PACKAGE_FILE"
      - name: Check whether this exact version is already published
        id: registry
        run: node scripts/check-published.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-release
          path: ${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, dependency installation, build, or package execution here.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: release
      - name: Verify artifact identity and digest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_FILE: ${{ needs.build.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFile, readdir } from 'node:fs/promises';
          assert.match(process.env.RELEASE_TAG, /^v\d+\.\d+\.\d+$/);
          const expected = `playwright-mixtape-reporter-${process.env.RELEASE_TAG.slice(1)}.tgz`;
          assert.equal(process.env.PACKAGE_FILE, expected);
          assert.deepEqual(await readdir('release'), [expected]);
          assert.match(process.env.EXPECTED_SHA256, /^[a-f0-9]{64}$/);
          const bytes = await readFile(`release/${expected}`);
          assert.equal(createHash('sha256').update(bytes).digest('hex'), process.env.EXPECTED_SHA256);
          JS
      - name: Publish verified bytes with OIDC and no lifecycle scripts
        env:
          PACKAGE_FILE: ${{ needs.build.outputs.filename }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: npm publish "./release/$PACKAGE_FILE" --ignore-scripts --access public --provenance
